name: Build CV PDFs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile LaTeX CVs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile CVs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: "*/*/cv.tex"
          work_in_root_file_dir: true
          latexmk_use_lualatex: true
          # Pin the build clock so an unchanged cv.tex yields a byte-identical
          # cv.pdf; otherwise LuaTeX stamps /CreationDate, /ModDate and /ID with
          # the wall clock and the commit-back step fires on every run. This has
          # to go through pre_compile rather than the step's env: the action
          # shells out to `docker run` with a fixed -e allowlist, so outside
          # variables never reach the compiler.
          pre_compile: "export SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1"

      # cv.tex compiles to cv.pdf. Publish it as CV_Almabud_Juwal_<Variant>.pdf,
      # with the variant taken from the folder name (professional-v1 becomes
      # Professional_v1), so a downloaded file is identifiable on its own.
      - name: Verify every CV produced a PDF and rename it
        run: |
          set -euo pipefail
          missing=0
          for tex in */*/cv.tex; do
            dir="$(dirname "$tex")"
            pdf="$dir/cv.pdf"
            variant="$(basename "$dir")"
            variant="$(printf '%s' "${variant:0:1}" | tr '[:lower:]' '[:upper:]')${variant:1}"
            named="$dir/CV_Almabud_Juwal_${variant//-/_}.pdf"
            if [ ! -s "$pdf" ]; then
              echo "::error file=$tex::expected $pdf was not generated"
              missing=1
            else
              mv -f "$pdf" "$named"
              echo "ok: $named ($(stat -c%s "$named") bytes)"
            fi
          done
          exit "$missing"

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v7
        with:
          name: compiled-cvs
          path: "*/*/CV_Almabud_Juwal_*.pdf"
          if-no-files-found: error

      - name: Commit PDFs back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- */*/CV_Almabud_Juwal_*.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged; nothing to commit"
          else
            git commit -m "chore: rebuild CV PDFs [skip ci]"
            git push
          fi
